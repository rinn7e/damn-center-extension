name: Release

on:
  push:
    tags: ['v*']
  # Publishing the checked draft release uploads it to the stores
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds and checks with a read-only token
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, to check that the tag is on master
          fetch-depth: 0
      # Cheap checks first, so a wrong tag fails before installing anything
      - name: Check the tag is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tag $GITHUB_REF_NAME points to a commit that isn't on master"
            exit 1
          fi
      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache: other branches can write to it, and this
          # build goes to the stores
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env.production
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build:release
      - name: Lint the Firefox package
        run: pnpm dlx web-ext@10.7.0 lint --source-dir dist/firefox
      - name: Write release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v header="## [$version]" '
            index($0, header) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[/) { exit }
            found && /^---$/ { next }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "No CHANGELOG.md section for $version"
            exit 1
          fi
      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum "damn-center-chrome-$GITHUB_REF_NAME.zip" \
            "damn-center-firefox-$GITHUB_REF_NAME.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/notes.md
            dist/SHA256SUMS.txt
            dist/damn-center-chrome-${{ github.ref_name }}.zip
            dist/damn-center-firefox-${{ github.ref_name }}.zip
          if-no-files-found: error

  # Only this job can write, and it runs no project code
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Signed build provenance for the zips (gh attestation verify)
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'damn-center-*.zip'
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft \
            --repo "$GITHUB_REPOSITORY" \
            --title "Damn Center $GITHUB_REF_NAME" \
            --notes-file notes.md \
            "damn-center-chrome-$GITHUB_REF_NAME.zip" \
            "damn-center-firefox-$GITHUB_REF_NAME.zip" \
            SHA256SUMS.txt

  # Uploads the zips of a published release to the stores. It runs no
  # project code, and only this job can read the store secrets
  stores:
    # Pre-releases stay on GitHub
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds the store secrets, and waits for the maintainer's approval
    environment: stores
    permissions:
      contents: read
      # gh attestation verify
      attestations: read
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      # Before any upload, so a missing secret never leaves one store behind
      - name: Check the store secrets are set
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          missing=0
          for name in CHROME_EXTENSION_ID CHROME_PUBLISHER_ID CHROME_CLIENT_ID \
            CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN AMO_API_KEY AMO_API_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing in the stores environment"
              missing=1
            fi
          done
          exit "$missing"
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "damn-center-chrome-$TAG.zip" \
            --pattern "damn-center-firefox-$TAG.zip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --archive zip --output source.zip
      - name: Check the zips were built by this workflow from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for zip in "damn-center-chrome-$TAG.zip" "damn-center-firefox-$TAG.zip"; do
            if ! gh attestation verify "$zip" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG"; then
              echo "::error::$zip has no build attestation from release.yml at $TAG, nothing was uploaded"
              exit 1
            fi
          done
      # The build instructions for the AMO reviewer, kept in doc/release.md
      - name: Write the AMO reviewer notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$GITHUB_REPOSITORY/contents/doc/release.md?ref=$TAG" > release.md
          # The code block between the two markers
          awk '
            /<!-- amo-reviewer-notes:start -->/ { found = 1; next }
            /<!-- amo-reviewer-notes:end -->/ { exit }
            found && /^```/ { inside = !inside; next }
            inside { print }
          ' release.md > notes.txt
          if [ ! -s notes.txt ]; then
            echo "::error::No AMO reviewer notes in doc/release.md at $TAG"
            exit 1
          fi
          jq -n --rawfile notes notes.txt \
            '{version: {approval_notes: ($notes | rtrimstr("\n"))}}' > amo-metadata.json
      - id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Upload to the Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        # Uploads the zip, then submits it for review
        run: |
          if ! npx --yes chrome-webstore-upload-cli@4.0.2 \
            --source "damn-center-chrome-$TAG.zip"; then
            echo "::error::Chrome Web Store upload of $TAG failed, see the log of this step"
            exit 1
          fi
      # Runs even when Chrome failed, so one store does not hold up the other
      - name: Upload to Firefox Add-ons
        if: ${{ !cancelled() && steps.node.conclusion == 'success' }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        # web-ext sign packs a folder, so it gets the files of the checked
        # zip. Approval is a human review, so it does not wait for it
        run: |
          unzip -q "damn-center-firefox-$TAG.zip" -d firefox
          if ! npx --yes web-ext@10.7.0 sign --channel listed \
            --source-dir firefox \
            --upload-source-code source.zip \
            --amo-metadata amo-metadata.json \
            --approval-timeout 0; then
            echo "::error::Firefox Add-ons upload of $TAG failed, see the log of this step"
            exit 1
          fi
